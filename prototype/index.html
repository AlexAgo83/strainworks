<!doctype html>
<html lang="fr">
<meta charset="utf-8">
<meta name="viewport" content="width=device-width, initial-scale=1, viewport-fit=cover">
<style>:root{color-scheme:light;padding-block:env(safe-area-inset-top,0px) env(safe-area-inset-bottom,0px)}html{box-sizing:border-box}body{margin:0}[hidden]{display:none!important}</style>
<title>Strainworks Prototype</title>
<meta name="claude:viewport-fit-sides" content="cover">
<link rel="stylesheet" href="https://fonts.googleapis.com/css2?family=Barlow:wght@400;600&family=Chakra+Petch:wght@600;700&display=swap">
<style>
/* Layout: one-screen app. Status, assault brief, board, selection, tools. From 900px the board takes the left. */
:root {
  color-scheme: dark;
  --night:#091013; --steel:#142126; --edge:#2C434A; --ink:#E6F0EC; --muted:#A3B8B3;
  --acid:#B7F34A; --cyan:#55D6E8; --alarm:#FF6B6B;
  --display:'Chakra Petch',Verdana,sans-serif; --body:'Barlow',Arial,sans-serif;
}
html, body { height:100%; }
body { background:var(--night); color:var(--ink); font:14px/1.3 var(--body); overflow:hidden; }
#app {
  box-sizing:border-box; height:100%; display:grid; gap:6px; padding-block:6px;
  padding-left:max(16px, env(safe-area-inset-left, 0px)); padding-right:max(16px, env(safe-area-inset-right, 0px));
  grid-template:"hud" auto "brief" auto "board" minmax(0,1fr) "info" auto "tools" auto / minmax(0,1fr);
}
button {
  font:inherit; color:var(--ink); background:var(--steel); border:1px solid var(--edge); border-radius:8px;
  min-height:40px; padding:4px 10px; cursor:pointer; touch-action:manipulation;
}
button:focus-visible { outline:2px solid var(--cyan); outline-offset:1px; }
button:disabled { opacity:.4; cursor:default; }
#hud { grid-area:hud; display:flex; align-items:center; gap:6px; min-width:0; }
#hud h1 { margin:0; font:700 12px var(--display); letter-spacing:0; color:var(--acid); }
#dna { display:block; color:var(--ink); font-size:12px; font-weight:600; font-variant-numeric:tabular-nums; white-space:nowrap; }
.meters { flex:1; min-width:0; display:grid; gap:3px; }
.meter { display:grid; grid-template-columns:48px minmax(0,1fr); align-items:center; gap:6px; font-size:12px; color:var(--muted); }
.meter span { height:7px; border-radius:4px; background:var(--steel); overflow:hidden; }
.meter i { display:block; height:100%; width:0; background:var(--alarm); }
.meter i.core { background:var(--cyan); }
#hud button { min-width:42px; padding:4px 6px; }
#brief { grid-area:brief; display:flex; align-items:center; gap:4px 12px; flex-wrap:wrap; min-height:32px; padding:5px 9px; border:1px solid var(--edge); border-radius:8px; }
#brief.hot { border-color:var(--alarm); }
#brief .threat { display:flex; align-items:center; gap:2px 7px; flex-wrap:wrap; width:100%; }
#brief .none { color:var(--alarm); }
.gene { display:inline-flex; align-items:center; gap:2px; vertical-align:middle; }
.gene svg { width:18px; height:18px; }
.need { color:var(--acid); }
.gene .cut { width:1px; height:18px; margin-inline:3px; background:var(--acid); }
#brief .order { display:flex; align-items:center; gap:2px 7px; flex-wrap:wrap; width:100%; }
#brief .boxed { padding:1px 6px; border:1px solid var(--cyan); border-radius:4px; color:var(--cyan); font-size:11px; white-space:nowrap; }
#brief .order output { margin-left:auto; color:var(--acid); font-variant-numeric:tabular-nums; }
#tools button.locked { color:var(--muted); }
#tools button.locked canvas { opacity:.3; }
#tools .price.lock { color:var(--cyan); }
#board { grid-area:board; position:relative; min-height:0; overflow:hidden; border:1px solid var(--edge); border-radius:8px; }
#zoom { position:absolute; right:6px; top:6px; display:grid; gap:4px; }
#zoom button { width:40px; padding:0; font-size:18px; }
#works { position:absolute; left:6px; top:6px; padding:4px 8px; border-radius:6px; background:var(--night); color:var(--cyan); font-size:12px; pointer-events:none; }
#rebuild { position:absolute; left:6px; bottom:6px; border-color:var(--alarm); color:var(--alarm); }
#gl { position:absolute; inset:0; width:100%; height:100%; pointer-events:none; }
#game { outline:none; position:absolute; inset:0; width:100%; height:100%; touch-action:none; user-select:none; -webkit-user-select:none; }
#over { position:absolute; inset:0; display:grid; place-content:center; justify-items:center; gap:12px; text-align:center; background:var(--night); }
#over h2 { margin:0; font:600 26px var(--display); color:var(--alarm); text-wrap:balance; }
#over p { margin:0; }
#info { grid-area:info; display:flex; align-items:center; gap:6px; min-height:50px; }
#message { flex:1; min-width:0; margin:0; color:var(--muted); }
#actions { display:flex; flex-wrap:wrap; justify-content:flex-end; gap:4px; max-width:60%; }
#actions:empty { display:none; }
#actions button { font-size:12px; padding:4px 7px; }
#message { font-size:13px; }
#info.filter { flex-direction:column; align-items:stretch; }
#info.filter #message { flex:none; }
#info.filter #actions { max-width:100%; justify-content:flex-start; }
#actions .slot { min-width:40px; border-color:var(--acid); }
#tools { grid-area:tools; display:grid; grid-template-rows:repeat(2,auto); grid-auto-flow:column; grid-auto-columns:minmax(max-content,1fr); gap:3px; overflow-x:auto; }
/* A long name widens its own column only. */
#tools button { display:grid; justify-items:center; gap:1px; padding:3px 1px; font-size:10px; min-width:56px; }
#tools button { position:relative; }
#tools .price { position:absolute; top:1px; right:2px; padding:0 3px; border-radius:4px; background:var(--night); color:var(--acid); font-size:10px; font-variant-numeric:tabular-nums; }
#tools .price.short { color:var(--alarm); }
#tools canvas { width:26px; height:26px; }
#tools button[aria-pressed="true"] { border-color:var(--acid); color:var(--acid); }
@media (min-width:900px) {
  #app { grid-template:"board hud" auto "board brief" auto "board info" auto "board tools" auto "board ." minmax(0,1fr) / minmax(0,1fr) 420px; gap:14px 28px; padding-block:18px; }
  #tools { grid-auto-flow:row; grid-template-rows:none; grid-auto-columns:auto; grid-template-columns:repeat(2,minmax(0,1fr)); min-height:0; overflow:auto; }
  #tools button { display:flex; align-items:center; gap:10px; padding:6px 12px; font-size:14px; }
  #info { align-items:flex-start; flex-direction:column; min-height:120px; }
  #actions { justify-content:flex-start; max-width:100%; }
}
</style>

<main id="app">
  <header id="hud">
    <div><h1>STRAINWORKS</h1><output id="dna" aria-label="ADN disponible"></output></div>
    <div class="meters">
      <div class="meter">Menace<span><i id="threat"></i></span></div>
      <div class="meter">Cœur<span><i id="core" class="core"></i></span></div>
    </div>
    <button id="pause" aria-label="Mettre en pause" aria-keyshortcuts="Space" title="Espace">II</button>
    <button id="speed" aria-label="Changer la vitesse">×1</button>
    <button id="restart">Reset</button>
  </header>
  <section id="brief" aria-live="polite"></section>
  <div id="board">
    <canvas id="gl" hidden aria-hidden="true"></canvas>
    <canvas id="game" tabindex="-1" aria-label="Plateau : gisements, machines, tapis et créatures"></canvas>
    <div id="zoom"><button id="zoom-in" aria-label="Zoomer">+</button><button id="zoom-out" aria-label="Dézoomer">−</button><button id="home" aria-label="Revenir au cœur">⌂</button><button id="dimension" aria-label="Passer en vue 3D">3D</button></div>
    <output id="works" hidden></output>

  </div>
  <section id="info"><p id="message"></p><div id="actions"></div></section>
  <nav id="tools" aria-label="Construction"></nav>
</main>

<script>
const W = 96, H = 96, STEP = .05; // W and H: the landing square, where every game starts the same
const SECTOR = 32, LIMIT = 1e5, OUTPOST = 24;
// The starting scenario is written around its own origin, in the middle of the map.
const OX = 43, OY = 40;
const DX = [0, 1, 0, -1], DY = [-1, 0, 1, 0];
const PAIR = {S:'C', C:'S', F:'N', N:'F'};
const BASE = {S:'Spore', F:'Fibre', C:'Chitine', N:'Nerf'};
const GENES = {SFS:'Moteur', FFF:'Soute', FSF:'Bouche', SSS:'Racine', CCF:'Carapace', CFC:'Dard', CCC:'Lame', CSC:'Acide', NFN:'Œil', SSN:'Soin', NSN:'Flair', FNF:'Pulsation', NNN:'Mémoire', NCN:'Commande', CNS:'Mutation', SNS:'Instinct'};
const TYPES = {
  hand:{name:'Inspecter', help:'Glisse ou utilise les flèches pour te déplacer, pince pour zoomer, touche une machine pour l’inspecter.'},
  belt:{name:'Tapis', help:'Glisse de la sortie vers l’entrée, la vue suit au bord. Deux doigts pour te déplacer. Pour croiser, pose un pont.', hp:30},
  gate:{name:'Feu', help:'Rail à interrupteur. Touche-le : vert, ça passe, rouge, la ligne attend derrière.', hp:30},
  mine:{name:'Récolteur', help:'À poser sur un gisement. Il donne 1 base par seconde.', hp:60},
  pump:{name:'Veine', help:'Touche pour poser une pompe. Tire d’une pompe à une autre, 24 cases au plus : 16 objets/s d’une seule matière, sous tout.', hp:90},
  track:{name:'Piste', help:'Glisse pour tracer la boucle des vers. Elle passe sous tout et se referme sur son départ.', hp:30},
  pocket:{name:'Poche', help:'À poser contre une piste. Trois poches côte à côte s’alignent sur les trois soutes. Touche-la pour charger ou vider.', hp:90},
  worm:{name:'Ver', help:'Touche une piste pour l’incuber : 3 soutes de 40, 12 cases par seconde.', hp:150},
  ligase:{name:'Ligase', help:'Trois entrées : 1 à gauche, 2 derrière, 3 à droite. Leur ordre écrit le gène.', hp:60},
  pack:{name:'Encapsuleur', help:'Gènes derrière, carbone sur le côté. Règle sa recette : capsule pour le cœur (2 carbones) ou chargeur pour les tourelles (1 carbone), avec 6 objets identiques.', hp:60},
  join:{name:'Assembleur', help:'Gène 1 à gauche, gène 2 à droite : un brin de deux gènes sort devant, le premier en tête.', hp:60},
  turret:{name:'Tourelle', help:'Tire les gènes livrés. Le brin opposé à celui de la créature fait le plus mal.', hp:180},
  cyst:{name:'Kyste', help:'Stocke 60 objets et les ressort par la flèche. À remplir avant un assaut.', hp:80},
  bridge:{name:'Pont', help:'Deux flux s’y croisent sans se mélanger. Touche-le pour régler le sens de chaque voie.', hp:40},
  split2:{name:'Diviseur 2', help:'Entrée derrière. Répartit à tour de rôle entre la gauche et la droite. Le tout droit est fermé.', hp:40},
  split:{name:'Diviseur 3', help:'Entrée derrière. Répartit à tour de rôle vers les trois autres côtés branchés.', hp:40},
  sort:{name:'Trieur', help:'Entrée derrière. Ce qui correspond au filtre sort du côté choisi, le reste va tout droit.', hp:40},
  wire:{name:'Nerf', help:'Tire entre une tourelle (Dard et Gueule compris), un feu ou un trieur, 24 cases au plus. La tourelle dit ce qu’il lui faut, les autres écoutent.', hp:30},
  sting:{name:'Dard', help:'Longue portée : 13 cases. Un tir par seconde, qui fait deux fois les dégâts. Fragile, garde-le derrière.', hp:120},
  maw:{name:'Gueule', help:'Courte portée : 4 cases. Deux coups à la fois, 2,5 fois par seconde. Elle encaisse, mais elle dévore les gènes.', hp:260},
  wall:{name:'Mur', help:'Bloque et encaisse. Les créatures doivent le casser pour passer.', hp:260},
  erase:{name:'Démonter', help:'Touche ou balaie ce que tu veux retirer : un drone vient le défaire, le temps de la pose. Tourelles et murs rendent leur ADN à la fin, moins les dégâts.'}
};
const VEIN = {reach:24, speed:16, pulse:.5, load:8, cap:48, hp:50};
const WORM = {speed:12, hold:40, load:16, pocket:120, hp:150, idle:2, timer:5};
const STAGES = [
  {name:'Cellule', item:'SFS', count:100, gives:'Diviseur 3, Trieur et Encapsuleur'},
  {name:'Tissu', item:'T:CCF', rate:2, hold:60, gives:'Veines, Nerfs, gisements ×2 et Assembleur'},
  {name:'Organe', item:'T:SFSFFF', count:10, gives:'Pistes, poches, vers et gisements ×4'}
];
// A container is a string too, so whatever carries items carries it: 'A:CNF' is a magazine, 'T:CCF' a capsule.
// K is carbon: matter, never a base, so it has no pair and never enters a gene.
const BOX = {A:{name:'Chargeur', carbon:1}, T:{name:'Capsule', carbon:2}};
const PACK = {size:6, genes:12, carbon:4, magazines:24};
// Every turret takes the same genes, they differ by reach, pace and shots in one volley. cost: before the shared rise.
const GUNS = {
  turret:{range:6.8, pace:3, volley:1, power:1, cost:20},
  sting:{range:13, pace:1, volley:1, power:2, cost:40},
  maw:{range:4, pace:2.5, volley:2, power:1, cost:30}
};
const isGun = c => Boolean(c && GUNS[c.type]);
// The ways out of a splitter, counted from the way it faces, in the order they take turns.
// 'split' is the three-way one: it was the only one, saved games hold it under that name.
const SPLIT = {split2:[3, 1], split:[3, 0, 1]};
const isSplit = c => Boolean(c && SPLIT[c.type]);
const splitExits = c => SPLIT[c.type].map(turn => (c.dir + turn) % 4);
const boxOf = item => item[1] === ':' ? item[0] : '';
const contentOf = item => boxOf(item) ? item.slice(2) : item;
const NEEDS = {split:1, sort:1, pack:1, pump:2, join:2, wire:2, track:3, pocket:3, worm:3};
const GROWTH_BONUS = 40;
const CORE = {x:OX + 5, y:OY + 12};
const NORTH = [{x:48,y:27}, {x:40,y:29}, {x:56,y:29}];
// Saves from before the deposits moved away keep these four, their harvesters stand on them.
const INNER = [['C',44,46,2,3], ['N',51,46,2,3], ['S',44,51,2,2], ['F',51,51,2,2]];
const OUTER = [
  ['S',34,44,4,3], ['F',59,43,4,3], ['C',36,56,3,4], ['N',57,57,4,3], ['S',47,63,4,3], ['F',28,52,3,4],
  ['N',32,35,3,3], ['C',62,34,3,3], ['F',41,67,4,3], ['S',66,50,3,4], ['C',20,42,5,5], ['N',74,42,5,5],
  ['S',23,66,6,4], ['F',67,66,6,4], ['C',46,78,6,5], ['N',40,12,5,4], ['F',12,20,7,6], ['S',78,18,7,6],
  ['N',10,78,7,7], ['C',80,80,7,7], ['S',6,50,5,6], ['F',85,52,5,6], ['K',60,50,3,3]
];
let FIELDS = [], DEPOSIT = {}, RICH = {};
function richness(x, y) { const d = Math.hypot(x - CORE.x - .5, y - CORE.y - .5); return d < 18 ? 1 : d < 34 ? 2 : 4; }
// Round the base one nest is enough: the one the first turret faces. The others start this far from the core.
const CALM = 30;
const keepsNest = b => b.id || (b.x === NORTH[0].x && b.y === NORTH[0].y) || Math.hypot(b.x - CORE.x, b.y - CORE.y) >= CALM;
// A game saved with more loses those still asleep. One that woke finishes its fight.
function thinNests() {
  const all = G.breaches;
  G.breaches = all.filter(b => b.state !== 'sleep' || keepsNest(b));
  for (const e of G.enemies || []) if (e.home != null) e.home = G.breaches.indexOf(all[e.home]);
}
function nest() {
  const all = NORTH.map(p => ({...p, r:6, left:24}));
  for (const [base, x, y, w, h] of OUTER) {
    const cx = x + w / 2, cy = y + h / 2, rich = richness(cx, cy);
    if (rich < 2) continue;
    const dx = cx - CORE.x, dy = cy - CORE.y, wide = Math.abs(dx) > Math.abs(dy);
    const at = wide ? {x:dx > 0 ? x + w + 3 : x - 4, y:Math.floor(cy)} : {x:Math.floor(cx), y:dy > 0 ? y + h + 3 : y - 4};
    const reach = Math.max(...[[x,y],[x+w-1,y],[x,y+h-1],[x+w-1,y+h-1]].map(([a,b]) => Math.hypot(a - at.x, b - at.y)));
    all.push({...at, r:Math.ceil(reach) + 1, left:rich === 2 ? 40 : 70});
  }
  // Thinned last, so each nest keeps the family it always had.
  G.breaches = all.map((b, i) => ({...b, total:b.left, genes:[G.families[i % 3]], state:'sleep', wave:0, pending:0, ended:0})).filter(keepsNest);
}
function survey() {
  FIELDS = G.far ? OUTER : [...INNER, ...OUTER]; DEPOSIT = {}; RICH = {};
  for (const [base, x, y, w, h] of FIELDS) for (let a = x; a < x + w; a++) for (let b = y; b < y + h; b++) { DEPOSIT[a + ',' + b] = base; RICH[a + ',' + b] = richness(x + w / 2, y + h / 2); }
}

// Past the landing square the world is never stored: a sector is a pure function of the seed and where it is.
// Only a breach that woke enters G.breaches, which only ever grows.
let sectors = new Map(), worldSeed = null;
const newSeed = () => crypto.getRandomValues(new Uint32Array(1))[0];
const atHome = (x, y) => x >= 0 && x < W && y >= 0 && y < H;
function dice(x, y, n) {
  let h = Math.imul(x, 374761393) + Math.imul(y, 668265263) + Math.imul(n, 1442695041) + G.seed;
  h = Math.imul(h ^ (h >>> 13), 1274126177);
  h = Math.imul(h ^ (h >>> 16), 1911520717);
  return ((h ^ (h >>> 15)) >>> 0) / 4294967296;
}
function sector(sx, sy) {
  if (worldSeed !== G.seed || sectors.size > 6000) { sectors = new Map(); worldSeed = G.seed; }
  const id = sx + ',' + sy;
  if (!sectors.has(id)) sectors.set(id, generate(sx, sy, id));
  return sectors.get(id);
}
function generate(sx, sy, id) {
  const left = sx * SECTOR, top = sy * SECTOR;
  if (atHome(left, top)) return null;
  const chance = dice(sx, sy, 1);
  // Carbon only lands where nothing was, so a world already played keeps its deposits. Nothing guards it.
  if (chance > .72) return chance > .86 ? {field:['K', left + 12, top + 12, 5 + Math.floor(dice(sx, sy, 9) * 3), 5]} : null;
  const roll = n => dice(sx, sy, n), away = Math.hypot(left + SECTOR / 2 - CORE.x, top + SECTOR / 2 - CORE.y);
  // Farther: bigger deposits, fuller breaches, harder creatures.
  const grown = Math.min(3, Math.floor(away / 120)), w = 5 + grown + Math.floor(roll(2) * 3), h = 4 + grown + Math.floor(roll(3) * 3);
  // Field and body stay clear of the sector's edge, so they never land on a neighbour's.
  const x = left + 8 + Math.floor(roll(4) * (17 - w)), y = top + 8 + Math.floor(roll(5) * (17 - h));
  const cx = x + w / 2, cy = y + h / 2, dx = cx - CORE.x, dy = cy - CORE.y, wide = Math.abs(dx) > Math.abs(dy);
  const bx = wide ? (dx > 0 ? x + w + 3 : x - 4) : Math.floor(cx), by = wide ? Math.floor(cy) : (dy > 0 ? y + h + 3 : y - 4);
  const reach = Math.max(...[[x,y],[x+w-1,y],[x,y+h-1],[x+w-1,y+h-1]].map(([a,b]) => Math.hypot(a - bx, b - by))), r = Math.ceil(reach) + 1;
  // Never into the landing square, or a game saved before the world grew would wake it on loading.
  if (Math.hypot(Math.max(-bx, 0, bx - W + 1), Math.max(-by, 0, by - H + 1)) <= r) return null;
  const total = Math.min(260, 70 + Math.floor(away / 80) * 15);
  return {
    field:['SFCN'[Math.floor(roll(6) * 4)], x, y, w, h],
    breach:{id, x:bx, y:by, r, left:total, total, tough:1 + Math.min(2, away / 400), genes:[G.families[Math.floor(roll(7) * 3)]], state:'sleep', wave:0, pending:0, ended:0}
  };
}
function eachSector(x0, y0, x1, y1, visit) {
  for (let sx = Math.floor(x0 / SECTOR); sx <= Math.floor(x1 / SECTOR); sx++)
    for (let sy = Math.floor(y0 / SECTOR); sy <= Math.floor(y1 / SECTOR); sy++) { const s = sector(sx, sy); if (s) visit(s); }
}
function fieldsIn(x0, y0, x1, y1) {
  const meets = ([, x, y, w, h]) => x <= x1 && x + w >= x0 && y <= y1 && y + h >= y0;
  const found = FIELDS.filter(meets);
  eachSector(x0, y0, x1, y1, s => { if (meets(s.field)) found.push(s.field); });
  return found;
}
// Every breach whose circle meets the box, woken or not.
function breachesIn(x0, y0, x1, y1) {
  const meets = b => b.x + b.r >= x0 && b.x - b.r <= x1 && b.y + b.r >= y0 && b.y - b.r <= y1;
  const found = G.breaches.filter(meets), woken = new Set(G.breaches.map(b => b.id));
  eachSector(x0 - 16, y0 - 16, x1 + 16, y1 + 16, s => { if (s.breach && !woken.has(s.breach.id) && meets(s.breach)) found.push(s.breach); });
  return found;
}
function depositAt(x, y) {
  if (atHome(x, y)) return DEPOSIT[key(x, y)];
  const f = sector(Math.floor(x / SECTOR), Math.floor(y / SECTOR))?.field;
  return f && x >= f[1] && x < f[1] + f[3] && y >= f[2] && y < f[2] + f[4] ? f[0] : undefined;
}
function richAt(x, y) {
  if (atHome(x, y)) return RICH[key(x, y)];
  const kind = depositAt(x, y);
  return kind && (kind === 'K' ? 2 : 4);
}

let wormId = null;
// The way the next piece faces is the player's, kept from one piece, one game and one visit to the next.
const HEADING_KEY = 'strainworks-heading';
const TURNS = ['belt','gate','mine','ligase','join','pack','cyst','split2','split','sort'];
const WAYS = ['haut','droite','bas','gauche'];
let heading = 0;
try { heading = [0, 1, 2, 3].find(d => String(d) === localStorage.getItem(HEADING_KEY)) ?? 0; } catch (_) {}
function setHeading(dir) {
  heading = dir;
  try { localStorage.setItem(HEADING_KEY, dir); } catch (_) {}
}

canvas.addEventListener('pointerup',release);
canvas.addEventListener('pointercancel',release);
canvas.addEventListener('contextmenu', event => event.preventDefault());
canvas.addEventListener('wheel', event => {
  event.preventDefault();
  const p = screenPoint(event);
  zoomAt(Math.exp(-event.deltaY * .0015),p.x,p.y);
}, {passive:false});
// The arrows glide the camera at one speed on screen, whatever the zoom. Shift is faster.
const GLIDE = {ArrowLeft:[-1,0], ArrowRight:[1,0], ArrowUp:[0,-1], ArrowDown:[0,1]};
const arrows = new Set();
let hurried = false;
document.addEventListener('keydown', event => {
  hurried = event.shiftKey;
  if (!GLIDE[event.key] || event.ctrlKey || event.metaKey || event.altKey) return;

});

document.addEventListener('visibilitychange', () => { if (document.hidden) arrows.clear(); });
function glide(elapsed) {

  pan(-x * far, -y * far);
  // A line being drawn follows the pointer over the moving map.
  if (gesture?.mode === 'draw' && drag) {

  }
}
function followEdge(elapsed) {

  const p = gesture.now, margin = 28, side = (v,max) => v < margin ? 1 : v > max - margin ? -1 : 0;
  const dx = side(p.x,view.w), dy = side(p.y,view.h);
  if (!dx && !dy) return;

$('zoom-in').onclick = () => zoomAt(1.35);
$('zoom-out').onclick = () => zoomAt(1 / 1.35);
$('home').onclick = () => home();

// ---- 2D or 3D. Babylon is only fetched when the 3D view is first asked for.
const BABYLON_SRC = 'https://cdn.jsdelivr.net/npm/babylonjs@9.31.0/babylon.js';
const BABYLON_HASH = 'sha384-GbwOam+gaf7GWvN708CvUiGqRFPFMS/lpYod2JfIip04KMa4TIJ8HXRjhwvT9DMC';
const VIEW_KEY = 'strainworks-view';
let made3d = null, switching = false;
function script(src, integrity) {
  return new Promise((resolve, reject) => {
    const tag = document.createElement('script');
    tag.src = src;
    if (integrity) { tag.integrity = integrity; tag.crossOrigin = 'anonymous'; }

}
async function show3D(on) {
  if (switching) return;
  switching = true;
  const toggle = $('dimension');
  try {
    if (on && !made3d) {
      toggle.textContent = '…';
      if (!window.BABYLON) await script(BABYLON_SRC, BABYLON_HASH);
      if (!window.createModels3D) await script('models3d.js');
      if (!window.createTerrain3D) await script('terrain3d.js');
      if (!window.createView3D) await script('view3d.js');
      // Built while visible, or the engine would start on an empty canvas.
      $('gl').hidden = false;
      made3d = window.createView3D($('gl'));
    }
    view3d = on ? made3d : null;
    $('gl').hidden = !on;
    try { localStorage.setItem(VIEW_KEY, on ? '3d' : '2d'); } catch (_) {}
  } catch (error) {
    view3d = null; $('gl').hidden = true;
    say('Vue 3D indisponible : il faut le réseau au premier chargement et WebGL. Le jeu continue en 2D.');
    console.warn('3D view unavailable:', error.message);
  }
  toggle.textContent = view3d ? '2D' : '3D';
  toggle.setAttribute('aria-label', view3d ? 'Passer en vue 2D' : 'Passer en vue 3D');
  switching = false;
}
$('dimension').onclick = () => show3D(!view3d);
$('rebuild').onclick = () => {
  for (const w of G.wires) if (!w.hp && w.out == null) Object.assign(w, {hp:NERVE.hp, left:1, order:G.seq = (G.seq || 0) + 1});
  for (const c of pumps()) {
    if (!c.to || c.veinOut != null || c.veinHp >= VEIN.hp / 2) continue;
    c.veinHp = VEIN.hp; c.veinLeft = 1.5; c.veinOrder = G.seq = (G.seq || 0) + 1;
  }
  let unpaid = 0;
  for (const [id, w] of Object.entries(G.ruins)) {
    if (G.cells[id]) { delete G.ruins[id]; continue; }
    const cost = Math.ceil(price(w.type) / 2);
    if (cost > G.dna) { unpaid++; continue; }
    G.dna -= cost;
    delete G.ruins[id];
    Object.assign(build(w.type, w.x, w.y, w.dir), {flip:w.flip, want:w.want || 'C', side:w.side || 3, ways:w.ways || null, open:w.open !== false, to:w.to || null, strict:Boolean(w.strict), unload:Boolean(w.unload), box:w.box || 'T', read:w.read || 0});
  }
  say(unpaid ? `${unpaid} défense${unpaid > 1 ? 's' : ''} en attente d’ADN, le reste est en chantier.` : 'Reconstruction lancée à l’identique.'); refresh();
};

// What is usable from the start comes first, then each stage's tools in the order they open.
const TOOLBAR = ['hand','erase','belt','mine','ligase','turret','sting','maw','wall','cyst','bridge','gate','split2','split','sort','pack','pump','join','wire','track','pocket','worm'];
for (const [type,info] of TOOLBAR.map(type => [type,TYPES[type]])) {
  const b = document.createElement('button'), icon = document.createElement('canvas'), g = icon.getContext('2d');
  icon.width = icon.height = 52; b.dataset.type = type;
  g.setTransform(46,0,0,46,26,26);
  if (type === 'hand') { circle(g,-.08,-.08,.25,null,'#A3B8B3',.09); polygon(g,[[.08,.14],[.15,.08],[.42,.34],[.34,.42]],'#A3B8B3'); }
  else if (type === 'erase') { g.strokeStyle='#FF6B6B'; g.lineWidth=.12; g.beginPath(); g.moveTo(-.3,-.3); g.lineTo(.3,.3); g.moveTo(.3,-.3); g.lineTo(-.3,.3); g.stroke(); }
  else if (type === 'bridge') { rect(g,-.22,-.5,.44,1,'#263E46','#4A6A73'); rect(g,-.5,-.22,1,.44,'#35505A','#6A8D94'); arrow(g,0,.49); arrow(g,1,.49); }
  else if (type === 'wire') { polygon(g,[[-.32,.22],[-.08,-.12],[.12,.08],[.34,-.26]],null,'#55D6E8',.07); circle(g,-.32,.22,.11,'#55D6E8'); circle(g,.34,-.26,.11,'#55D6E8'); }
  else if (type === 'track') { for (const x of [-.35,-.12,.11]) circle(g,x,0,.07,'#B7F34A'); arrow(g,1,.46,'#B7F34A'); }
  else if (type === 'worm') { for (const x of [-.3,-.06,.18]) circle(g,x,0,.2,'#2A4A22','#C9F77A',.05); circle(g,.34,0,.13,'#4E7F2D','#C9F77A',.05); }
  else drawCell(g,{...cell(type,1,11,type === 'belt' ? 1 : 0)});
  b.append(icon, document.createTextNode(info.name));
  if (NEEDS[type]) { const tag = document.createElement('span'); tag.className = 'price lock'; tag.textContent = `stade ${NEEDS[type]}`; b.append(tag); }
  if (PRICE[type]) { const tag = document.createElement('span'); tag.className = 'price'; b.append(tag); }
  b.onclick = () => choose(type);
  $('tools').append(b);
}

const togglePause = () => { paused = !paused; refresh(); };
$('pause').onclick = togglePause;
// Space pauses. It only presses a button for who reached that button with Tab: after a click the focus just lingers.
let tabbed = false;
document.addEventListener('pointerdown', () => { tabbed = false; }, true);
function spacePauses(event) {
  if (event.code !== 'Space' || event.ctrlKey || event.metaKey || event.altKey) return false;
  if (tabbed && event.target.closest?.('button')) return false;

  event.preventDefault();
  return true;
}
document.addEventListener('keydown', event => {
  if (event.key === 'Tab') tabbed = true;
  if (spacePauses(event) && !event.repeat && !G.over) togglePause();
});
document.addEventListener('keyup', spacePauses);
$('speed').onclick = () => { speed = speed === 1 ? 3 : 1; $('speed').textContent = '×' + speed; };
let armed = 0;
$('restart').onclick = () => {
  if (Date.now() > armed) { armed = Date.now() + 3000; $('restart').textContent = 'Sûr ?'; return; }
  armed = 0; $('restart').textContent = 'Reset'; begin();
};
$('again').onclick = () => begin();
// R turns what is under the pointer, or the piece in hand. Shift turns the other way.
function rotate(back) {
  const by = back ? 3 : 1, building = tool !== 'hand' && tool !== 'erase';
  const p = hovered && preview(), under = p && G.cells[key(p.x, p.y)];
  // With a piece in hand the last one placed stays selected: it must not take the key from the next.
  const c = under && (TURNS.includes(under.type) || under.type === 'bridge') ? under : !building && selected ? G.cells[selected] : null;
  if (c?.type === 'bridge') turnWay(c, back ? 0 : 1);
  else if (c && TURNS.includes(c.type)) {
    c.dir = (c.dir + by) % 4;
    if (building) setHeading(c.dir);
  } else {
    setHeading((heading + by) % 4);
    if (building) {

      say(`Sens : ${WAYS[heading]}. R pour tourner, Maj+R dans l’autre sens.`);
    }
  }

}
document.addEventListener('keydown', event => {
  if (event.key.toLowerCase() !== 'r' || event.ctrlKey || event.metaKey || event.altKey) return;
  event.preventDefault();
  rotate(event.shiftKey);
});

const SAVE = 'souche-proto-2', OLD_SAVE = 'souche-proto-1';
function save() { try { localStorage.setItem(SAVE, JSON.stringify(G)); } catch (_) {} }
function load() {
  try {
    let saved = JSON.parse(localStorage.getItem(SAVE));
    if (!saved) {
      // A game from the 11 x 14 board continues in the middle of the big map.
      saved = JSON.parse(localStorage.getItem(OLD_SAVE));
      if (saved?.cells) {
        const moved = {};
        for (const c of Object.values(saved.cells)) { c.x += OX; c.y += OY; moved[key(c.x,c.y)] = c; }
        saved.cells = moved; saved.shots = [];
        for (const e of saved.enemies || []) { e.x += OX; e.y += OY; }
      }
    }
    if (saved && !saved.over && saved.cells?.[key(CORE.x,CORE.y)] && Array.isArray(saved.families)) { G = saved; if (!G.paid) { G.dna += START_DNA; G.paid = true; } G.ruins ||= {}; G.tracks ||= {}; G.worms ||= []; G.wires ||= []; if (!G.drones) hatchDrones(); if (!G.capsules) { G.capsules = true; G.meals = []; if (G.stage === 2) G.fed = Math.floor(G.fed / PACK.size); } G.seed ??= newSeed(); if (G.stage == null) Object.assign(G, {stage:0, fed:0, held:0, meals:[], open:true}); survey(); if (!G.breaches) { G.woken = 0; nest(); } else thinNests(); return true; }
  } catch (_) {}

}
function begin() {
  fresh(); choose('hand'); home();
  say('Le cœur a faim : fabrique le gène demandé en haut et amène-le jusqu’à lui. Les brèches dorment.');
  save(); refresh();
}

resize();
if (load()) { choose('hand'); home(); say('Partie reprise. Glisse ou utilise les flèches pour te déplacer, pince pour zoomer.'); }
else begin();
new ResizeObserver(resize).observe($('board'));

let before = performance.now(), owed = 0, shownAt = 0, savedAt = 0;
function frame(now) {
  const elapsed = Math.min(.15,(now-before)/1000); before = now;
  if (!paused && !document.hidden) {
    owed += elapsed*speed;
    while (owed >= STEP) { step(STEP); owed -= STEP; }
  }
  if (armed && Date.now() > armed) { armed = 0; $('restart').textContent = 'Reset'; }
  if (now-shownAt > 250) { refresh(); shownAt = now; }
  if (now-savedAt > 3000) { save(); savedAt = now; }
  glide(elapsed);
  followEdge(elapsed);
  setCursor();
  draw();
  requestAnimationFrame(frame);
}
refresh();
requestAnimationFrame(frame);
try { if (localStorage.getItem(VIEW_KEY) === '3d') show3D(true); } catch (_) {}
</script>
