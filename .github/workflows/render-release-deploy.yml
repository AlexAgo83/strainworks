name: Deploy Render on release

on:
  release:
    types: [published]
  workflow_dispatch:
    inputs:
      release_tag:
        description: Published release tag to deploy, for example v0.1.0.
        required: true
        type: string

permissions:
  actions: read
  contents: read

concurrency:
  group: render-release-deploy
  cancel-in-progress: false

jobs:
  deploy:
    runs-on: ubuntu-latest
    timeout-minutes: 25
    steps:
      - uses: actions/checkout@3d3c42e5aac5ba805825da76410c181273ba90b1
        with:
          fetch-depth: 0

      - name: Resolve release commit
        id: release
        env:
          GH_TOKEN: ${{ github.token }}
          RELEASE_TAG_INPUT: ${{ inputs.release_tag || github.event.release.tag_name || '' }}
        run: |
          set -euo pipefail

          release_tag="$RELEASE_TAG_INPUT"
          if [ -z "$release_tag" ]; then
            echo "Missing release tag."
            exit 1
          fi

          if ! [[ "$release_tag" =~ ^v[0-9]+\.[0-9]+\.[0-9]+$ ]]; then
            echo "A release tag looks like v0.1.0."
            exit 1
          fi
          if [ "$(gh release view "$release_tag" --json isDraft --jq .isDraft)" != "false" ]; then
            echo "Only a published release deploys."
            exit 1
          fi

          git fetch --tags --force
          release_sha="$(git rev-parse --verify "refs/tags/${release_tag}^{commit}")"
          if ! git merge-base --is-ancestor "$release_sha" origin/main; then
            echo "The release commit is not on main."
            exit 1
          fi

          echo "tag=$release_tag" >> "$GITHUB_OUTPUT"
          echo "sha=$release_sha" >> "$GITHUB_OUTPUT"

      - name: Verify package version
        env:
          RELEASE_TAG: ${{ steps.release.outputs.tag }}
          RELEASE_SHA: ${{ steps.release.outputs.sha }}
        run: |
          set -euo pipefail

          expected="${RELEASE_TAG#v}"
          actual="$(git show "${RELEASE_SHA}:package.json" | node -e 'let b=""; process.stdin.on("data", c => b += c); process.stdin.on("end", () => console.log(JSON.parse(b).version));')"
          if [ "$actual" != "$expected" ]; then
            echo "package.json version $actual does not match $RELEASE_TAG."
            exit 1
          fi

      - name: Verify CI on release commit
        env:
          GH_TOKEN: ${{ github.token }}
          RELEASE_SHA: ${{ steps.release.outputs.sha }}
        run: |
          set -euo pipefail

          runs="$(gh run list --workflow ci.yml --commit "$RELEASE_SHA" --json conclusion,status,url --limit 20)"
          success_url="$(jq -r '.[] | select(.status == "completed" and .conclusion == "success") | .url' <<< "$runs" | head -n 1)"
          if [ -z "$success_url" ]; then
            echo "A successful CI run is required before deploying ${RELEASE_SHA}."
            exit 1
          fi
          echo "CI succeeded: $success_url"

      - name: Trigger Render deploy
        env:
          RENDER_DEPLOY_HOOK_URL: ${{ secrets.RENDER_DEPLOY_HOOK_URL }}
          RELEASE_SHA: ${{ steps.release.outputs.sha }}
        run: |
          set -euo pipefail

          if [ -z "$RENDER_DEPLOY_HOOK_URL" ]; then
            echo "Missing RENDER_DEPLOY_HOOK_URL secret."
            exit 1
          fi

          separator="?"
          if [[ "$RENDER_DEPLOY_HOOK_URL" == *"?"* ]]; then
            separator="&"
          fi

          curl --ipv4 --connect-timeout 10 --max-time 60 --fail-with-body --silent --show-error \
            --request POST "${RENDER_DEPLOY_HOOK_URL}${separator}ref=${RELEASE_SHA}"

      - name: Verify the public site serves the release
        env:
          SITE_URL: ${{ vars.RENDER_SITE_URL }}
          RELEASE_SHA: ${{ steps.release.outputs.sha }}
          POLL_TIMEOUT_SECONDS: 900
        run: |
          set -euo pipefail

          if [ -z "$SITE_URL" ]; then
            echo "Missing RENDER_SITE_URL repository variable."
            exit 1
          fi

          # No account key here: the site says which commit it was built from.
          deadline=$((SECONDS + POLL_TIMEOUT_SECONDS))
          while [ "$SECONDS" -le "$deadline" ]; do
            served="$(curl --ipv4 --connect-timeout 10 --max-time 30 --fail --silent "${SITE_URL%/}/version.json" | jq -r '.commit // empty' || true)"
            if [ "$served" = "$RELEASE_SHA" ]; then
              echo "The site serves ${RELEASE_SHA}."
              exit 0
            fi
            sleep 15
          done

          echo "Timed out waiting for ${SITE_URL} to serve ${RELEASE_SHA}."
          exit 1
